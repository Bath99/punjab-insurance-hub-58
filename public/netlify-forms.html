<!DOCTYPE html>
<html>
<head>
  <title>Netlify Forms - Punjab Insurance</title>
</head>
<body>
  <!-- This file helps Netlify detect our forms. It won't be visible to users. -->
  
  <!-- Super Visa Insurance Form -->
  <form name="supervisa-quote" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="supervisa-quote" />
    <input type="text" name="quote-type" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="number" name="age" />
    <input type="text" name="coverage" />
    <input type="date" name="tripStart" />
    <textarea name="medicalConditions"></textarea>
  </form>

  <!-- Life Insurance Form -->
  <form name="life-insurance-quote" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="life-insurance-quote" />
    <input type="text" name="quote-type" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="number" name="age" />
    <input type="number" name="coverage" />
    <input type="text" name="term" />
    <input type="text" name="smoker" />
  </form>

  <!-- RESP Form -->
  <form name="resp-quote" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="resp-quote" />
    <input type="text" name="quote-type" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="childName" />
    <input type="number" name="childAge" />
    <input type="number" name="annualContribution" />
    <input type="number" name="familyIncome" />
  </form>

  <!-- Critical Illness Insurance Form -->
  <form name="critical-illness-quote" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="critical-illness-quote" />
    <input type="text" name="quote-type" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="number" name="age" />
    <input type="text" name="coverage" />
    <textarea name="medicalHistory"></textarea>
  </form>

  <!-- Disability Insurance Form -->
  <form name="disability-insurance-quote" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="disability-insurance-quote" />
    <input type="text" name="quote-type" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="number" name="age" />
    <input type="number" name="annualIncome" />
    <input type="text" name="occupation" />
    <input type="text" name="coveragePercent" />
  </form>

  <!-- Travel Insurance Form -->
  <form name="travel-insurance-quote" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="travel-insurance-quote" />
    <input type="text" name="quote-type" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="tripType" />
    <input type="text" name="destination" />
    <input type="date" name="tripStart" />
    <input type="date" name="tripEnd" />
    <input type="number" name="travelers" />
  </form>
</body>
</html>
